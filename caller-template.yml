# Copy this file to .github/workflows/pr-review.yml in the repository to be reviewed.
# The repository also needs one secret: CLAUDE_CODE_OAUTH_TOKEN.
#
# What it does:
#   - every opened, reopened, ready-for-review or updated PR is built, tested, reviewed.
#     A new push cancels the review still running for the previous push.
#   - a comment from a person on a PR the reviewer is currently blocking gets answered:
#     it re-checks its own findings and says which stand and which it withdraws. It does
#     not rebuild and does not review again. Comments on any other PR are ignored.
#
# Drafts, fork PRs, bot comments and PRs labelled `no-review` are never run.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  # Answering back. These fire for every comment in the repo, so the job `if` below
  # does the filtering — and note GitHub always runs the copy of this file on the
  # default branch for them, never the copy on the PR branch.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Reviews and replies queue separately: a comment must never cancel a running review.
  group: >-
    pr-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{
    github.event_name == 'pull_request' && 'review' || 'reply' }}
  cancel-in-progress: true

jobs:
  pr-review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'no-review')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        github.event.comment.user.type != 'Bot' &&
        !contains(github.event.issue.labels.*.name, 'no-review')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.comment.user.type != 'Bot' &&
        !contains(github.event.pull_request.labels.*.name, 'no-review')
      )
    permissions:
      contents: read
      pull-requests: write
      issues: write          # the reply job posts a PR comment
      id-token: write
    uses: Designblue-Manila/pr-reviewer/.github/workflows/review.yml@main
    secrets:
      # passed explicitly: `secrets: inherit` does not reach a workflow owned by another account
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    # Optional overrides:
    # with:
    #   model: claude-opus-5
    #   max_turns: 60
    #   skip_build: false   # true for a repo with nothing to build
