# Copy this file, unchanged, to .github/workflows/pr-review.yml — on the default branch
# AND on every other long-lived branch pull requests target (dev, uat, prod…): GitHub
# runs a pull request's workflows from its BASE branch. The repository also needs one
# secret: CLAUDE_CODE_OAUTH_TOKEN.
#
# This file is identical in every repository (the two canary repos differ in the tag on the
# `uses:` line, nothing else) and holds only what GitHub will not let the
# shared workflow hold: the events that wake it, the permissions it may use, the secret
# and the pinned release. What runs and what is skipped (drafts, forks, bot comments, the
# `no-review` label), and what cancels what, is decided in the shared workflow — so it
# changes by moving a tag, not by a pull request here. Do not add `if:`, `concurrency:`
# or `with:`; repo-specific context goes in .github/REVIEW-NOTES.md.
#
# Every opened, reopened, ready-for-review or pushed-to PR is built, tested and reviewed.
# A comment from a person on a PR the reviewer has ruled on gets an answer.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  # These fire for every comment in the repository; the shared workflow skips the ones
  # that are not for it without starting a machine. GitHub always runs the default
  # branch's copy of this file for them.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  pr-review:
    # The shared workflow may ask for LESS than this, never more: if it does, GitHub
    # refuses to start the run at all. `checks` and `actions` are granted ahead of need
    # so that using them later does not mean another pull request in every repository.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      checks: read
      actions: read
    # Pinned to a release tag, never @main. Moving the tag is the deploy; moving it back
    # is the rollback. See RELEASING.md in the pr-reviewer repository.
    uses: Designblue-Manila/pr-reviewer/.github/workflows/review.yml@v2
    secrets:
      # passed explicitly: `secrets: inherit` does not reach a workflow owned by another account
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
